         often ignore Cache-Control on them, so changing the URL is the only
         reliable way to ship a new icon. Bump it whenever the icon changes. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      name="description"

    />
    <title>Brender Odoyo — Backend &amp; Full-Stack Developer</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
